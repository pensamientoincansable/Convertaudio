<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORTE — Taller de audio</title>
    <meta
      name="description"
      content="Convierte cualquier archivo de audio a MP3, WAV, FLAC, AAC, Opus y decenas de formatos más. En tu dispositivo. Sin servidor."
    />
    <meta name="theme-color" content="#080706" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="CORTE — Taller de audio" />
    <meta
      property="og:description"
      content="Corta cualquier audio a cualquier formato. El archivo no sale de tu dispositivo."
    />
    <meta property="og:image" content="/atmosphere.jpg" />
  </head>
  <body>
    <div class="fx-atmosphere" aria-hidden="true"></div>
    <canvas class="fx-grain" id="grain" aria-hidden="true"></canvas>
    <div class="ghost-rate" id="ghost-rate" aria-hidden="true">192</div>

    <header class="top">
      <p class="top-mark">
        <img src="/mark.png" width="22" height="22" alt="" />
        <span>CORTE</span>
      </p>
      <p class="top-meta">N.º 01 · Taller de masterización · 2026</p>
    </header>

    <aside class="spine" aria-hidden="true">
      <span class="spine-brand">CORTE</span>
      <span class="spine-rule"></span>
      <span class="spine-kicker">Cámara de corte</span>
    </aside>

    <div class="layout">
      <section class="stage">
        <div
          class="platter"
          id="platter"
          role="button"
          tabindex="0"
          aria-label="Cargar un archivo de audio del dispositivo"
        >
          <div class="platter-glow"></div>
          <canvas id="wave"></canvas>
          <div class="platter-core" id="core"></div>
        </div>
        <div class="stage-foot">
          <p class="stage-note" id="stage-note">El audio no sale de tu dispositivo.</p>
          <button class="text-link" id="open-device" type="button">Abrir almacenamiento</button>
        </div>
      </section>

      <section class="desk" id="desk">
        <div class="plates">
          <div id="select-format"></div>
          <div id="select-rate"></div>
          <div id="select-hz"></div>
        </div>
        <div class="channels" id="channels">
          <span>Canales</span>
          <button class="chip is-on" type="button" data-ch="original">Origen</button>
          <button class="chip" type="button" data-ch="mono">Mono</button>
          <button class="chip" type="button" data-ch="stereo">Estéreo</button>
        </div>
        <button class="cut" id="cut" type="button" disabled>Cortar el máster</button>
      </section>
    </div>

    <footer class="colophon">
      <p>Local · privado · sin nube</p>
      <p>MP3 WAV FLAC AAC OPUS OGG AIFF ALAC AC-3 WMA y el resto del catálogo</p>
    </footer>

    <input
      class="file-input"
      id="file"
      type="file"
      accept="audio/*,video/*,.mp3,.wav,.flac,.ogg,.oga,.opus,.m4a,.aac,.wma,.aiff,.aif,.webm,.amr,.ac3,.mp2,.au,.caf,.voc,.mka,.wv,.tta,.w64,.gsm,.spx,.mp4,.mov,.mkv,.3gp"
    />
    <div class="toast" id="toast" hidden role="status"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
